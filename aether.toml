# Aether runtime configuration
# [database] is enabled by default: every @PgSql-backed slice (most of them) needs
# `database.async_url` to provision its store, and a slice whose store cannot provision never
# leaves LOADED. Points at a running PostgreSQL (see README "Run locally (Forge)", and
# ./start-postgres.sh for a matching local container). Not the same switch as forge.toml's
# `[database] enabled`, which toggles Ember's embedded H2 simulator and should stay false.
[database]
async_url = "postgresql://postgres:postgres@localhost:5432/forge"

[database.pool_config]
min_connections = 4
max_connections = 20
connection_timeout = "30s"
idle_timeout = "10m"
max_lifetime = "30m"
validation_query = ""
leak_detection_timeout = "0s"
io_threads = 0

# Payment gateway for the @Http HttpClient resource in BuyTicket and CancelTicket.
# WITHOUT this section the blueprint does not deploy at all: deploy-time validation reports
#   slice 'BuyTicket' requires config section [http] for its HttpClient resource
# and Forge exits rather than starting degraded. HttpClientConfig exposes no public DEFAULT, so
# every non-Option component below is mandatory — omitting one fails the same way as omitting the
# whole section.
#
# base_url points at the local stub gateway from ./start-gateway.sh (WireMock, see
# gateway-stubs/). The slices call POST /authorize, /refund and /void on it; no third-party
# sandbox implements that contract, which is why this is a stub rather than a real provider.
[http]
base_url = "http://localhost:9100"
connect_timeout = "5s"
request_timeout = "30s"
follow_redirects = "NORMAL"
default_headers = {}

# Notification sender for the @Notify resource in BuyTicket (booking confirmation email).
# Also mandatory for deploy: 'BuyTicket requires config section [notification]'.
# The send is best-effort by design — BuyTicket's sendConfirmation ends `.recover(_ -> unit())`
# (forward error recovery), so a purchase still succeeds with nothing listening on port 1025.
# Run a local Mailpit/MailHog on that port if you want to SEE the confirmation email.
[notification]
backend = "smtp"

[notification.smtp_config]
host = "localhost"
port = 1025
tls_mode = "NONE"
connect_timeout = "5s"
command_timeout = "10s"

# ============================================================================
# [app-http] -- APP HTTP SECURITY. SHIPPED DISABLED. MANDATORY FOR THE WALKTHROUGH.
# ============================================================================
#
# WHAT IT IS
# `[app-http]` configures authentication for the application HTTP port (:8070) -- the mode the node
# accepts credentials in, and the keys it accepts. It is read by Forge from this file, the sibling
# `aether.toml` next to `forge.toml`.
#
# WHY YOU NEED IT
# 13 of this project's 19 routed slices declare `role:admin`, `authenticated` or `role:operator` in
# their `routes.toml`. Without this block every one of them answers:
#
#     401  {"detail":"Route requires authentication but no security mode is configured"}
#
# Only the 6 `public` read slices respond. The documented walkthrough begins with
# `POST /api/v1/events/create`, which is `role:admin` -- so it FAILS ON ITS FIRST STEP with this
# block disabled. That is not a misconfiguration on your part; it is this file shipping inert.
#
# Note the enabling condition precisely: Forge applies this section ONLY when the resulting key map
# is NON-EMPTY. Leaving the block present with no keys is equivalent to omitting it -- every node
# stays on the deny-unless-public validator. Commenting it out, as shipped, has the same effect.
#
# HOW TO ENABLE IT
# Delete the leading "# " from each line between the two ENABLE markers below. Nothing else in this
# file needs to change, and no other file does either. Then pass the key on every non-public call:
#
#     curl -H "X-API-Key: local-dev-insecure-do-not-use" ...
#
# For anything that is not a local demo, do NOT uncomment these keys. Set `AETHER_API_KEYS` in the
# environment instead: `ConfigLoader` reads it AHEAD of any TOML, so a real deployment never edits
# this file. Format is `key:name:role1,role2:AUTHZ_ROLE`, semicolon-separated for several.
#
# WHAT THE FIELDS MEAN
# `security_mode` is one of `api-key` (the `X-API-Key` header), `jwt` (a Bearer token with JWKS
# validation) or `none`. `roles` is the set a route's `role:admin` / `role:operator` label is
# matched against. `authorization_role` is the SEPARATE management-plane level -- ADMIN is what
# Forge itself presents when calling its own control-plane routes, so an ADMIN-capable key must
# exist or Forge cannot drive the cluster it just started.
#
# ABOUT THIS KEY
# The demo's key is DELIBERATELY WORTHLESS and named to be unmistakable. It cannot be pasted into a
# real deployment without the reader noticing, which is the point: a credential that announces its
# own worthlessness is safe, a plausible-looking one is not, however well commented. This repository
# is PUBLIC, so the risk being managed is not that this key is valuable -- it is that a reader copies
# the PATTERN into something that is.
#
# --- ENABLE BELOW ---
# [app-http]
# security_mode = "api-key"
#
# [app-http.api-keys.local-dev-insecure-do-not-use]
# name = "dev-admin"
# roles = ["admin", "operator", "user"]
# authorization_role = "ADMIN"
# --- ENABLE ABOVE ---
