prefix = "/api/v1/availability/sold"

[routes]
execute = "GET /{event}"

# public: an aggregate count over published inventory -- no customer, booking or price data, and it is the
# figure the public event page shows.
[security]
default = "public"

[errors]
strict = true
default = 500
HTTP_400 = ["*InvalidRequest*"]
HTTP_503 = ["*ServiceUnavailable*"]
