prefix = "/api/v1/booking/buy"

[routes]
execute = "POST /"

# authenticated: takes payment and issues a ticket against a named customer -- the strongest reason in this
# subsystem for a credential to exist.
[security]
default = "authenticated"

[errors]
strict = true
default = 500
HTTP_400 = ["*InvalidRequest*"]
HTTP_402 = ["*PaymentRefused*"]
HTTP_409 = ["*StateConflict*"]
HTTP_422 = ["*Unprocessable*", "*UnacceptableValue*"]
HTTP_503 = ["*ServiceUnavailable*"]
