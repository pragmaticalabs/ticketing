prefix = "/api/v1/pricing/adjust"

[routes]
execute = "POST /"

# role:admin: moves the price customers will be charged -- revenue-bearing catalogue administration.
[security]
default = "role:admin"

[errors]
strict = true
default = 500
HTTP_400 = ["*InvalidRequest*"]
HTTP_404 = ["*PriceNotFound*"]
HTTP_422 = ["*UnacceptableValue*"]
HTTP_503 = ["*StoreUnavailable*"]
