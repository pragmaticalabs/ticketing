prefix = "/api/v1/events/open"

[routes]
execute = "POST /{event}"

# role:admin: puts an event on sale -- the lifecycle transition that exposes inventory to the public, so it
# belongs to the organiser alone.
[security]
default = "role:admin"

[errors]
strict = true
default = 500
HTTP_400 = ["*InvalidRequest*"]
HTTP_404 = ["*EntityMissing*"]
HTTP_409 = ["*LifecycleConflict*", "*TransitionRaced*"]
HTTP_503 = ["*ServiceUnavailable*"]
